name: Bug report
description: Report an install failure or a false positive from the Doctor
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Please fill in the fields below.

        **Most important:** open the app, click **Copy report** and paste the
        content into the "Report" field. It already contains everything needed
        (and no personal data).

  - type: textarea
    id: report
    attributes:
      label: Doctor report
      description: Paste the text from the "Copy report" button here
      render: text
      placeholder: |
        Meta Horizon Link Doctor v1.0.0
        Windows: 10.0.26200 (Windows 11)
        [FAIL] Policy blocks "Display adapters" class drivers
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: What happens
      description: Describe what the Meta installer does (screen, message, when it stops)
      placeholder: "E.g.: downloads up to 100%, shows 'Setup complete' and then goes back to the first screen..."
    validations:
      required: true

  - type: input
    id: installer_version
    attributes:
      label: Meta installer version
      description: Setup.exe properties > Details > File version
      placeholder: "1.115.0.0"

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: |
        Attach these files if possible:
        - %LOCALAPPDATA%\Oculus\OculusSetup.log
        - %LOCALAPPDATA%\Oculus\OculusDriverInstaller_*.log
        - C:\Windows\INF\setupapi.dev.log
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I ran the Doctor as Administrator and clicked "Fix problems"
          required: true
        - label: I ran the Meta installer again after the fix
          required: true
